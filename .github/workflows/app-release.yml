name: Release de l'app Ludothèque

# Tag app-vX.Y.Z -> AppImage signée (son embarqué) + latest.json publiés dans une release GitHub.
# L'app installée lit https://github.com/Guilhem-Bonnet/ludotheque/releases/latest/download/latest.json,
# vérifie la signature avec la clé publique de tauri.conf.json, puis propose « Mettre à jour ».
# Indépendant de l'image serveur (tags vX.Y.Z, workflow image.yml).
on:
  push:
    tags: ["app-v*.*.*"]
  # Une PR qui touche ce workflow ou l'app construit l'AppImage SANS publier : la release est
  # vérifiée avant le tag (quatre tags ont échoué faute de cette vérification).
  pull_request:
    paths: [".github/workflows/app-release.yml", "apps/ludo-ui/**", "crates/**", "Cargo.*"]

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    # 22.04 : glibc assez ancienne pour tourner sur Fedora récent comme sur SteamOS.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # La version affichée par l'app (Réglages) et celle comparée par la mise à jour viennent du tag.
          jq --arg v "$v" '.version = $v' apps/ludo-ui/src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json apps/ludo-ui/src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" apps/ludo-ui/src-tauri/Cargo.toml
          grep -m1 '^version' apps/ludo-ui/src-tauri/Cargo.toml

      - name: Dépendances système (WebKitGTK, GStreamer pour le son embarqué)
        run: |
          sudo apt-get update
          # Plugins GStreamer seulement (embarqués dans l'AppImage) : les paquets -dev de GStreamer
          # tirent libunwind-dev, en conflit avec libunwind-14 préinstallé sur ubuntu-22.04.
          # libudev-dev : bibliothèque des manettes (gilrs → libudev-sys).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ludo-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # .cargo/config.toml du dépôt fixe target-dir sur le poste de dev (/home/guilhem/.cache/…) :
      # la CI compile dans son propre dossier (la variable prime sur le fichier de configuration).
      - name: Dossier de compilation de la CI
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Dépendances de l'interface
        working-directory: apps/ludo-ui
        run: npm ci

      - name: Construction, signature et publication
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          NO_STRIP: "true"
          GSTREAMER_PLUGINS_DIR: /usr/lib/x86_64-linux-gnu/gstreamer-1.0
          GSTREAMER_HELPERS_DIR: /usr/lib/x86_64-linux-gnu/gstreamer1.0/gstreamer-1.0
        with:
          projectPath: apps/ludo-ui
          # package.json n'a pas de script « tauri » : la CLI est appelée directement.
          tauriScript: npx tauri
          args: --bundles appimage
          # Sur une PR : construction seule (pas de tag, pas de release).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Ludothèque ${{ steps.version.outputs.version }}
          releaseBody: Mise à jour de l'application Ludothèque (PC, Steam Deck). Installée depuis l'écran Mises à jour.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
