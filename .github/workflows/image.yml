name: Image ludo-server

# Construit et publie ghcr.io/guilhem-bonnet/ludo-server :
#   - push sur master  -> tags sha-<court> et latest
#   - tag vX.Y.Z       -> tags X.Y.Z, X.Y et sha-<court>
#   - pull request     -> construction seule (pas de publication)
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths-ignore: ["fiches/**", "**/*.md"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "Cargo.*", "crates/**", ".github/workflows/image.yml"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/guilhem-bonnet/ludo-server
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
