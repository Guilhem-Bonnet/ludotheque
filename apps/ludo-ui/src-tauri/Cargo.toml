[package]
name = "ludo-ui"
version = "0.1.0"
description = "Ludothèque : interface (coque Tauri 2)"
edition = "2021"
license = "MIT"

[lib]
name = "ludo_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
ludo-client = { path = "../../../crates/ludo-client" }
ludo-proto = { path = "../../../crates/ludo-proto" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gilrs = "0.11"
toml = "1.2.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Interface intégrée au binaire (sans elle, Tauri charge le serveur de développement localhost:5173).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
