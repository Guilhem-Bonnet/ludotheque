[package]
name = "ludo-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ludo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
libc = "0.2"
ludo-core = { version = "0.1.0", path = "../ludo-core" }
ludo-proto = { version = "0.1.0", path = "../ludo-proto" }
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
axum = "0.8.9"
ludo-server = { path = "../ludo-server" }
tokio = { version = "1.54.1", features = ["full"] }
