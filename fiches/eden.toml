# Eden — émulateur Switch en second, seul disponible sur la Thor (Android).
id        = "eden"
consoles  = ["switch"]
formats   = ["nsp", "xci"]
lancement = "{bin} -f -u {profil_index} -g {rom}"
profils   = "natifs"
# Titre en majuscules et sauvegarde « appareil » sous l UUID nul : mesuré le 15/11 sur Eden 0.2.1 (PC).
sauvegardes = "{data}/nand/user/save/0000000000000000/{profil_uuid}/{title_id_maj}"
exclusions  = ["*.tmp"]
systeme     = ["keys/prod.keys", "keys/title.keys"]

[appareil.pc]
bin  = "flatpak run dev.eden_emu.eden"
data = "~/.var/app/dev.eden_emu.eden/data/eden"

[appareil.deck]
bin  = "~/Applications/Eden.AppImage"
data = "~/Emulation/storage/eden"

[appareil.thor]
bin  = "dev.eden.eden_emulator"
data = "/sdcard/Android/data/dev.eden.eden_emulator/files"

# Détection (du préféré au moins préféré) : le premier moyen trouvé sur l'appareil l'emporte sur
# les sections [appareil.*] ci-dessus. Le Flatpak garde exactement les chemins mesurés le 15/11.
[[detection]]
flatpak = "dev.eden_emu.eden"
data    = ["~/.var/app/dev.eden_emu.eden/data/eden"]

[[detection]]
appimage = "Eden*.AppImage"
data     = ["~/Emulation/storage/eden", "~/.local/share/eden"]

[[detection]]
commande = "eden"
data     = ["~/.local/share/eden"]
