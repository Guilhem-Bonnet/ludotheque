# Ryujinx (Ryubing) — émulateur Switch par défaut (décision du 14/11/2026).
# Chemins relevés par la session PC le 14/11 (mesurés sur le PC et le Deck).
id        = "ryujinx"
consoles  = ["switch"]
formats   = ["nsp", "xci"]
lancement = "{bin} --fullscreen --profile {profil_nom} {rom}"
profils   = "natifs"
# Ryujinx range les sauvegardes par index (bis/user/save/<index>/), relié au jeu par saveMeta :
# la traduction vers la forme neutre (title_id) est faite par l'adaptateur Ryujinx de `ludo`.
sauvegardes = "{data}/bis/user/save"
exclusions  = ["*.tmp", "Config.json", "logs/", "games/"]
systeme     = ["system/prod.keys", "system/title.keys"]

[appareil.pc]
bin  = "flatpak run io.github.ryubing.Ryujinx"
data = "~/.var/app/io.github.ryubing.Ryujinx/config/Ryujinx"

[appareil.deck]
bin  = "~/Applications/publish/Ryujinx"
data = "~/.var/app/io.github.ryubing.Ryujinx/config/Ryujinx"

# Détection (du préféré au moins préféré) : le premier moyen trouvé sur l'appareil l'emporte sur
# les sections [appareil.*] ci-dessus. Le Flatpak garde exactement les chemins mesurés le 14/11.
[[detection]]
flatpak = "io.github.ryubing.Ryujinx"
data    = ["~/.var/app/io.github.ryubing.Ryujinx/config/Ryujinx"]

[[detection]]
fichier = "~/Applications/publish/Ryujinx"
data    = ["~/.var/app/io.github.ryubing.Ryujinx/config/Ryujinx", "~/.config/Ryujinx"]

[[detection]]
appimage = "Ryujinx*.AppImage"
data     = ["~/.config/Ryujinx"]

[[detection]]
commande = "Ryujinx"
data     = ["~/.config/Ryujinx"]
